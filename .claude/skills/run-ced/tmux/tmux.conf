# tmux config for the harness (N-139): the settings the README asks a ced
# user to have. run.sh's TMUX_CONF picks tmux-default.conf instead to see
# what an untouched tmux does.
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
# No status line: the pane is the whole window, so a script's mouse
# coordinates mean the same cell inside and outside tmux.
set -g status off
