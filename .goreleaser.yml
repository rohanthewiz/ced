#
# GoReleaser config for ced. Driven by .github/workflows/release.yml on
# every push to the `release` branch: that workflow bumps
# internal/version/version.go and tags v<x.y.z>, then invokes
# `goreleaser release --clean`. Goreleaser then cross-compiles the binary,
# archives it, and attaches the archives and checksums to a GitHub Release.
#
# No Homebrew formula is published (the `brews:` block was removed on
# 2026-09-14). ced's official install is the cats plugin, which builds from
# source; the release archives remain for install.sh and manual installs.

version: 2

project_name: ced

before:
  hooks:
    - go mod tidy

builds:
  - id: ced
    binary: ced
    main: .
    env:
      - CGO_ENABLED=0
    # POSIX only. The embedded grsh terminal panel (internal/app/terminal.go)
    # depends on process-group and job-control syscalls — SIGTSTP, SIGUSR1/2,
    # Setpgid, Getpgrp — that don't exist in Go's syscall package on Windows,
    # so a windows target simply doesn't compile. Restoring it means
    # build-tagging the terminal panel out, not flipping this list back.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"
