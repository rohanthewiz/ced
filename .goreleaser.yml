#
# GoReleaser config for ced. Driven by .github/workflows/release.yml on
# every push to main: that workflow bumps internal/version/version.go and
# tags v<x.y.z>, then invokes `goreleaser release --clean`. Goreleaser then
# cross-compiles the binary, archives it, attaches it to a GitHub Release,
# and (when the homebrew tap secret is set) updates the Homebrew formula.

version: 2

project_name: ced

before:
  hooks:
    - go mod tidy

builds:
  - id: ced
    binary: ced
    main: .
    env:
      - CGO_ENABLED=0
    # POSIX only. The embedded grsh terminal panel (internal/app/terminal.go)
    # depends on process-group and job-control syscalls — SIGTSTP, SIGUSR1/2,
    # Setpgid, Getpgrp — that don't exist in Go's syscall package on Windows,
    # so a windows target simply doesn't compile. Restoring it means
    # build-tagging the terminal panel out, not flipping this list back.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

# Homebrew formula committed straight back into this repo under Formula/.
# Users install via:
#
#   brew tap rohanthewiz/ced https://github.com/rohanthewiz/ced
#   brew install rohanthewiz/ced/ced
#
# Because the formula lives in the same repo as the source, the default
# GITHUB_TOKEN the workflow already holds is enough to push it — no PAT,
# no separate tap repo. The [skip ci] marker on the formula-update commit
# stops the new push from triggering a second release run.
brews:
  - name: ced
    repository:
      owner: rohanthewiz
      name: ced
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    commit_msg_template: "Update {{ .ProjectName }} brew formula to {{ .Tag }} [skip ci]"
    homepage: "https://github.com/rohanthewiz/ced"
    description: "ced — opinionated mouse-first terminal code editor."
    license: "MIT"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    install: |
      bin.install "ced"
    test: |
      assert_path_exists bin/"ced"
